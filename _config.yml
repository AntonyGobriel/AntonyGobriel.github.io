# --- Theme ---
theme: jekyll-theme-minimal

# --- Site Info ---
title: "Antony Gobriel"
description: "PhD Candidate in Economic History of migration and demography · Université de Lille"
author: "Antony Gobriel"

# --- URL & Baseurl ---
url: "https://antonygobriel.github.io"
baseurl: ""

# --- Social ---
github:
  username: antonygobriel

# --- Markdown & Syntax ---
markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  auto_ids: true

# --- Plugins ---
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# --- Defaults ---
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"

# --- Exclude from build ---
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - "*.gemspec"
  - vendor/
